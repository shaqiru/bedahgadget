# Pemeriksaan untuk setiap pull request, termasuk dari fork penulis.
# Berjalan tanpa secret dan dengan token baca saja. Jangan ganti trigger ke pull_request_target:
# trigger itu menjalankan kode PR dengan akses ke secret repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache optimized images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: astro-assets-

      - name: Workflow policy
        run: node scripts/check-workflows.mjs

      - name: Publication allowlist
        run: npm run check:publication

      - name: Content security
        run: npm run check:content

      - name: Build (astro check, build, theme check)
        run: npm run build

      - name: Validate dist/
        run: npm run check:dist

      - name: Style lint (advisory)
        run: npm run lint:style
